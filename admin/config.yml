# Pannello di modifica del sito Limun Studio Design (Sveltia CMS)
backend:
  name: github
  repo: limunstudiodesign/limunstudio
  branch: main
  auth_methods: [token]

media_folder: media
public_folder: /media
media_libraries:
  default:
    config:
      max_file_size: 26214400
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400

app_title: Limun Studio Design
site_url: https://limunstudio.pages.dev

collections:
  - name: sito
    label: Sito
    files:
      - name: projects
        label: Progetti
        file: content/projects.json
        format: json
        fields:
          - name: projects
            label: Progetti
            label_singular: Progetto
            widget: list
            hint: "L'ordine qui è l'ordine del portfolio: trascina i progetti per spostarli."
            summary: "{{fields.client}} — {{fields.category}}"
            collapsed: true
            fields:
              - { name: client, label: Cliente, widget: string }
              - { name: subtitle, label: Sottotitolo, widget: string, required: false, hint: "Facoltativo, es. il committente (Delivera)." }
              - { name: year, label: Anno, widget: string, required: false, hint: "Es. 2024 oppure 2022–" }
              - { name: category, label: Categoria, widget: string, hint: "Es. Social Contents, Creative Direction. I filtri del sito si creano da qui." }
              - { name: categories, label: Categorie secondarie, widget: select, multiple: true, required: false, options: [ { label: "Social Contents", value: "Social Contents" }, { label: "Podcast", value: "Podcast" }, { label: "Creative Direction", value: "Creative Direction" }, { label: "Media Contents", value: "Media Contents" }, { label: "Contents", value: "Contents" }, { label: "City Branding", value: "City Branding" }, { label: "Art Direction", value: "Art Direction" }, { label: "Communication", value: "Communication" }, { label: "Brand Identity", value: "Brand Identity" }, { label: "Video Corporate", value: "Video Corporate" }, { label: "Visual Identity", value: "Visual Identity" }, { label: "Video Contents", value: "Video Contents" }, { label: "Graphic Design", value: "Graphic Design" }, { label: "Photography", value: "Photography" }, { label: "Video", value: "Video" } ], hint: "Spunta le altre categorie in cui deve comparire con i filtri. Sotto il progetto si vede solo la principale. Per aggiungere voci a questo elenco chiedi a Claude." }
              - { name: hidden, label: Nascondi dal sito, widget: boolean, default: false, required: false }
              - { name: cover, label: Copertina, widget: image, required: false, hint: "L'immagine del progetto nel portfolio. Carica la foto intera: in home si vede in 4:3 e con i due campi «Fuoco» scegli quale parte mostrare." }
              - { name: cover_focus_x, label: "Fuoco copertina: orizzontale", widget: select, required: false, default: "50", options: [ { label: "Tutto a sinistra", value: "0" }, { label: "Sinistra", value: "25" }, { label: "Centro", value: "50" }, { label: "Destra", value: "75" }, { label: "Tutto a destra", value: "100" } ], hint: "Quale parte della foto o del video resta visibile se va tagliata ai lati." }
              - { name: cover_focus_y, label: "Fuoco copertina: verticale", widget: select, required: false, default: "50", options: [ { label: "Tutto in alto", value: "0" }, { label: "Alto", value: "25" }, { label: "Centro", value: "50" }, { label: "Basso", value: "75" }, { label: "Tutto in basso", value: "100" } ], hint: "Quale parte della foto o del video resta visibile se va tagliata sopra e sotto." }
              - { name: cover_video, label: Video di copertina, widget: file, required: false, hint: "Facoltativo: mp4 breve in loop al posto della copertina. Massimo 25 MB." }
              - { name: cover_youtube, label: Video di copertina da YouTube, widget: string, required: false, hint: "Facoltativo: incolla un link YouTube. In home parte da solo, muto e in loop, senza player. Se c'è anche il video mp4, vince l'mp4. La foto di copertina resta come anteprima mentre carica." }
              - { name: description, label: Testo, widget: text, required: false, hint: "Lascia una riga vuota tra un paragrafo e l'altro." }
              - name: credits
                label: Crediti
                label_singular: Credito
                widget: list
                required: false
                summary: "{{fields.name}} — {{fields.role}}"
                fields:
                  - { name: name, label: Nome, widget: string }
                  - { name: role, label: Ruolo, widget: string, required: false }
              - { name: layout, label: Impaginazione, widget: select, required: false, default: auto, options: [ { label: "Automatica: verticali in colonna a destra", value: auto }, { label: "Nell'ordine del pannello, a righe", value: rows } ], hint: "Con «Nell'ordine» foto e video restano nella sequenza che vedi qui e si dispongono in righe a tutta larghezza." }
              - &media
                name: media
                label: Foto e video
                label_singular: Elemento
                widget: list
                required: false
                hint: "Trascina per cambiare l'ordine. Se il progetto ha lavorazioni, qui le foto non si vedono: vanno dentro ogni lavorazione."
                types: &mtypes
                  - name: image
                    label: Foto
                    summary: "Foto {{fields.caption}}"
                    fields:
                      - { name: src, label: Foto, widget: image }
                      - { name: alt, label: Descrizione per accessibilità, widget: string, required: false }
                      - &size { name: size, label: Dimensione, widget: select, default: half, options: [ { label: Mezza larghezza, value: half }, { label: A tutta larghezza, value: full } ] }
                      - &ratio { name: ratio, label: Formato, widget: select, default: auto, options: [ { label: Originale, value: auto }, { label: "1:1", value: "1/1" }, { label: "4:5", value: "4/5" }, { label: "3:4", value: "3/4" }, { label: "2:3", value: "2/3" }, { label: "4:3", value: "4/3" }, { label: "3:2", value: "3/2" }, { label: "16:9", value: "16/9" }, { label: "9:16", value: "9/16" } ] }
                      - &caption { name: caption, label: Didascalia, widget: string, required: false }
                  - name: gallery
                    label: Gruppo di foto
                    summary: "Gruppo di foto"
                    fields:
                      - { name: images, label: Foto, widget: image, multiple: true, hint: "Seleziona o trascina più foto insieme. Trascinale per cambiare l'ordine." }
                      - { name: per_row, label: Foto per riga, widget: select, default: "2", options: [ { label: "1", value: "1" }, { label: "2", value: "2" }, { label: "3", value: "3" }, { label: "4", value: "4" } ], hint: "Sul telefono diventano al massimo due per riga." }
                      - *ratio
                      - *caption
                  - name: video
                    label: Video (file mp4)
                    summary: "Video {{fields.caption}}"
                    fields:
                      - { name: src, label: File video, widget: file, hint: "mp4, massimo 25 MB. Per video più lunghi usa YouTube o Vimeo." }
                      - { name: poster, label: Immagine di anteprima, widget: image, required: false }
                      - { name: sound, label: Con audio e controlli, widget: boolean, default: false, required: false, hint: "Attivo: il video ha l'audio e si avvia con il play. Spento: parte da solo, muto e in loop." }
                      - *size
                      - *caption
                  - name: youtube
                    label: YouTube
                    summary: "YouTube {{fields.url}}"
                    fields:
                      - { name: url, label: Link YouTube, widget: string, hint: "Incolla il link del video o dello short." }
                      - *size
                      - *caption
                  - name: vimeo
                    label: Vimeo
                    summary: "Vimeo {{fields.url}}"
                    fields:
                      - { name: url, label: Link Vimeo, widget: string }
                      - *size
                      - *caption
                  - name: link
                    label: Link
                    summary: "Link {{fields.label}}"
                    fields:
                      - { name: label, label: Testo del link, widget: string, hint: "Es. Guarda la campagna, Leggi l'articolo" }
                      - { name: url, label: Indirizzo, widget: string, hint: "Incolla il link completo, https://…" }
                      - *size
                  - name: instagram
                    label: Instagram (post o reel)
                    summary: "Instagram {{fields.url}}"
                    fields:
                      - { name: url, label: Link Instagram, widget: string, hint: "L'embed mostra la cornice di Instagram. Per un risultato più pulito carica il reel come Video." }
                      - *size
                      - *caption
              - name: works
                label: Lavorazioni
                label_singular: Lavorazione
                widget: list
                required: false
                hint: "Le strisce a fisarmonica. Scegli «Lavorazione» per foto e video, «Podcast» per stagioni ed episodi YouTube. Se ne aggiungi almeno una, il progetto mostra le strisce al posto di «Foto e video»."
                types:
                  - name: standard
                    label: Lavorazione
                    summary: "{{fields.title}}"
                    fields:
                      - { name: title, label: Titolo, widget: string, hint: "Es. Pura R, FW 26/27" }
                      - { name: open, label: Aperta all'apertura della pagina, widget: boolean, default: false, required: false }
                      - { name: text, label: Testo, widget: text, required: false }
                      - { name: layout, label: Impaginazione, widget: select, required: false, default: auto, options: [ { label: "Automatica: verticali in colonna a destra", value: auto }, { label: "Nell'ordine del pannello, a righe", value: rows } ], hint: "Con «Nell'ordine» foto e video restano nella sequenza che vedi qui e si dispongono in righe a tutta larghezza." }
                      - *media
                  - name: series
                    label: Serie video
                    summary: "Serie video: {{fields.title}}"
                    fields:
                      - { name: title, label: Titolo della striscia, widget: string, hint: "Es. Behind The Athlete" }
                      - { name: open, label: Aperta all'apertura della pagina, widget: boolean, default: false, required: false }
                      - { name: text, label: Testo, widget: text, required: false }
                      - name: episodes
                        label: Episodi
                        label_singular: Episodio
                        widget: list
                        summary: "{{fields.title}}"
                        fields:
                          - { name: number, label: Numero, widget: string, required: false, hint: "Facoltativo: es. 04 per tutte le parti della stessa puntata. Vuoto = numerazione automatica." }
                          - { name: title, label: Titolo, widget: string }
                          - { name: guest, label: Ospite, widget: string, required: false }
                          - { name: url, label: Link YouTube, widget: string, required: false, hint: "Incolla il link del video su YouTube." }
                  - name: podcast
                    label: Podcast
                    summary: "Podcast: {{fields.title}}"
                    fields:
                      - { name: title, label: Titolo della striscia, widget: string, hint: "Es. Podcast | Ruota Libera" }
                      - { name: open, label: Aperta all'apertura della pagina, widget: boolean, default: false, required: false }
                      - { name: start_season, label: Stagione mostrata all'apertura, widget: number, value_type: int, min: 1, required: false, hint: "Es. 3 per partire dalla Stagione 03. Vuoto = la prima." }
                      - { name: text, label: Testo, widget: text, required: false }
                      - name: seasons
                        label: Stagioni
                        label_singular: Stagione
                        widget: list
                        summary: "{{fields.label}} {{fields.title}}"
                        fields:
                          - { name: label, label: Nota interna, widget: string, required: false, hint: "Non compare sul sito: le pillole si numerano da sole (Stagione 01, 02…)." }
                          - { name: title, label: Titolo della stagione, widget: string, required: false }
                          - name: episodes
                            label: Episodi
                            label_singular: Episodio
                            widget: list
                            summary: "{{fields.title}}"
                            fields:
                              - { name: number, label: Numero, widget: string, required: false, hint: "Facoltativo: es. 04 per tutte le parti della stessa puntata. Vuoto = numerazione automatica." }
                              - { name: title, label: Titolo, widget: string }
                              - { name: guest, label: Ospite, widget: string, required: false }
                              - { name: url, label: Link YouTube, widget: string, required: false, hint: "Incolla il link del video su YouTube." }
              - name: extra
                label: Dopo le strisce
                label_singular: Elemento
                widget: list
                required: false
                hint: "Foto, video e link liberi che compaiono sotto tutte le strisce, fuori dalla fisarmonica."
                types: *mtypes

      - name: settings
        label: Studio, About e Contact
        file: content/settings.json
        format: json
        fields:
          - { name: name, label: Nome dello studio, required: false, widget: string }
          - { name: about, label: Testo About, required: false, widget: text, hint: "Lascia una riga vuota tra un paragrafo e l'altro." }
          - { name: services, label: Services, label_singular: Servizio, widget: list, required: false }
          - { name: clients, label: Clients, label_singular: Cliente, widget: list, required: false, hint: "In ordine di importanza. Se il nome è uguale a quello di un progetto, diventa un link alla sua pagina." }
          - name: team
            label: Team
            label_singular: Persona
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { name: name, label: Nome, required: false, widget: string }
              - { name: role, label: Ruolo, widget: string, required: false }
          - { name: contacts_in_about, label: Mostra i contatti anche nell'About, widget: boolean, default: false, required: false, hint: "Indirizzo, e-mail e Instagram si vedono sempre nel footer e in Contact." }
          - { name: address, label: Indirizzo, required: false, widget: text, hint: "Una riga per volta, come deve apparire." }
          - { name: email, label: E-mail, required: false, widget: string }
          - { name: instagram_url, label: Link Instagram, widget: string, required: false }
          - { name: instagram_handle, label: Nome Instagram, widget: string, required: false, hint: "Es. @limunstudiodesign" }
          - { name: privacy, label: Testo Privacy, required: false, widget: text, hint: "Il testo che si apre con la pillola Privacy in fondo alla pagina Contact. Lascia una riga vuota tra un paragrafo e l'altro." }
          - name: vat
            label: Partite IVA (footer)
            label_singular: Titolare
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.number}}"
            fields:
              - { name: name, label: Nome, required: false, widget: string }
              - { name: number, label: Partita IVA, required: false, widget: string }
